services:
  mysql:
    image: mysql:8.0
    container_name: orderwise_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "127.0.0.1"
      MYSQL_DATABASE: commands_db
      MYSQL_USER: orderwise
      MYSQL_PASSWORD: orderwise
    ports:
      - "3306:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./.docker/mysql/data:/var/lib/mysql
      - ./.docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - frontend
      - backend

  api_gateway:
    build:
      context: ./api_orderwise_gateway
      dockerfile: Dockerfile
    container_name: orderwise_api_gateway
    restart: unless-stopped
    env_file:
      - ./api_orderwise_gateway/.env
    environment:
      API_PORT: 8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: commands_db
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend
      - backend

  mvp:
    build:
      context: ./api_orderwise
      dockerfile: Dockerfile
      args:
        user: orderwise
        uid: 1000
    container_name: orderwise_api_mvp
    restart: unless-stopped
    env_file:
      - ./api_orderwise/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: commands_db
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_MIGRATE_HOST: mysql
      DB_MIGRATE_PORT: 3306
      DB_MIGRATE_USERNAME: root
      DB_MIGRATE_PASSWORD: root
      DB_QUIERO_HOST: mysql
      DB_QUIERO_PORT: 3306
      DB_QUIERO_USERNAME: root
      DB_QUIERO_PASSWORD: root
      APP_URL: http://localhost:8001
      PEDIDOS_YA_API: http://ai_chat:8000/
    working_dir: /var/www
    volumes:
      - ./api_orderwise:/var/www
    command: sh -lc "composer install && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend
      - backend

  ai_chat:
    build:
      context: ./api_orderwise_ai_chat
      dockerfile: Dockerfile
    container_name: orderwise_api_ai_chat
    restart: unless-stopped
    env_file:
      - ./api_orderwise_ai_chat/.env
    environment:
      API_BASE_URL: http://ai_chat:8000
      API_PORT: 8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: commands_db
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8002:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true


