services:
   

    mysql:
      image: mysql:latest
      container_name: orderwise_gateway_mysql
      restart: unless-stopped
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: commands_db
        MYSQL_USER: orderwise
        MYSQL_PASSWORD: orderwise
      ports:
        - "3306:3306"
      command: >
        --default-authentication-plugin=mysql_native_password
        --character-set-server=utf8mb4
        --collation-server=utf8mb4_unicode_ci
      volumes:
        - ./docker/mysql/data:/var/lib/mysql
        - ./docker/mysql/init:/docker-entrypoint-initdb.d
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
        interval: 10s
        timeout: 5s
        retries: 10
        
    api_gateway:
      build:
        context: .
        dockerfile: api_orderwise_gateway/Dockerfile
      container_name: orderwise_api_gateway
      restart: unless-stopped
      env_file:
        - .env
      ports:
        - "8000:8000"
      depends_on:
        mysql:
          condition: service_healthy
    mvp:
      build:
        context: .
        dockerfile: api_orderwise/Dockerfile
      container_name: orderwise_api_mvp
      restart: unless-stopped
      env_file:
        - .env
      ports:
        - "8000:8001"
      depends_on:
        mysql:
          condition: service_healthy
    ai_chat:
      build:
        context: .
        dockerfile: api_orderwise_ai_chat/Dockerfile
      container_name: orderwise_api_ai_chat
      restart: unless-stopped
      env_file:
        - .env
      ports:
        - "8000:8002"
      depends_on:
        mysql:
          condition: service_healthy


